<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BABOK® Knowledge Areas · Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2530; --slate:#334155; --paper:#faf8f3; --amber:#c47f2a;
    --amber-soft:#f0e2cb; --line:#e4ded2; --bg:#eef1f4; --teal:#2f6d6a;
    --ka1:#c47f2a; --ka2:#2f6d6a; --ka3:#7a4fb0;
    --ka4:#2e7d55; --ka5:#c0392b; --ka6:#3f78c9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:28px 20px 40px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px;margin:0 auto;}

  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:8px;}
  h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1;}
  h1 .mono{font-family:'IBM Plex Mono',monospace;background:var(--ink);color:var(--paper);padding:1px 10px;border-radius:6px;font-size:22px;letter-spacing:.05em;margin-right:4px;}
  .sub{color:var(--slate);margin:10px 0 0;font-size:14.5px;max-width:640px;}
  .langBtn{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:8px 14px;cursor:pointer;flex-shrink:0;}

  /* stats bar */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--slate);}
  .stat b{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--ink);display:block;line-height:1.2;}

  /* mnemonic */
  .mnemonic{background:var(--ink);color:#f0e2cb;border-radius:12px;padding:14px 18px;margin-bottom:22px;font-size:13.5px;line-height:1.5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .mnemonic .code{font-family:'IBM Plex Mono',monospace;background:var(--amber);color:#fff;padding:6px 12px;border-radius:8px;font-weight:800;letter-spacing:.15em;font-size:14px;}
  .mnemonic .txt{flex:1;min-width:200px;}
  .mnemonic .txt b{color:#fff;}

  /* KA grid */
  .kaGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  @media(max-width:840px){.kaGrid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:520px){.kaGrid{grid-template-columns:1fr;}}
  .kaTile{border-radius:14px;padding:16px 18px;cursor:pointer;color:#fff;border:none;text-align:left;font-family:inherit;transition:transform .15s ease, box-shadow .15s ease;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;}
  .kaTile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(28,37,48,.15);}
  .kaTile.active{box-shadow:0 0 0 3px var(--ink), 0 8px 20px rgba(28,37,48,.2);transform:translateY(-2px);}
  .kaNum{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;opacity:.7;margin-bottom:6px;font-weight:700;}
  .kaEmoji{font-size:26px;margin-bottom:8px;}
  .kaName{font-size:15px;font-weight:750;line-height:1.25;margin:0 0 6px;}
  .kaRole{font-size:12.5px;opacity:.9;line-height:1.4;margin:0;}
  .kaCount{position:absolute;top:12px;right:14px;font-family:'IBM Plex Mono',monospace;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.05em;}

  /* KA colors */
  .ka1{background:var(--ka1);}
  .ka2{background:var(--ka2);}
  .ka3{background:var(--ka3);}
  .ka4{background:var(--ka4);}
  .ka5{background:var(--ka5);}
  .ka6{background:var(--ka6);}

  /* detail panel */
  .detail{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 4px 20px rgba(28,37,48,.06);margin-bottom:22px;}
  .detailHead{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .detailBadge{font-family:'IBM Plex Mono',monospace;font-weight:800;font-size:13px;min-width:36px;height:36px;padding:0 10px;display:grid;place-items:center;border-radius:9px;color:#fff;flex-shrink:0;}
  .detailInfo h2{font-size:20px;font-weight:750;margin:0 0 3px;letter-spacing:-.01em;}
  .detailInfo p{font-size:13.5px;color:var(--slate);margin:0;}
  .detailBody{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:640px){.detailBody{grid-template-columns:1fr;}}
  .detailSection h3{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;margin:0 0 10px;}
  .taskList{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;}
  .taskList li{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13.5px;display:flex;align-items:flex-start;gap:9px;line-height:1.4;}
  .taskNum{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;color:var(--slate);min-width:16px;flex-shrink:0;padding-top:1px;}
  .verbBox{background:#fff;border:1px dashed var(--line);border-radius:9px;padding:11px 14px;font-size:13px;line-height:1.5;}
  .verbBox b{color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;}
  .roleBox{background:var(--ink);color:#f0e2cb;border-radius:10px;padding:12px 15px;margin-top:12px;font-size:13px;line-height:1.5;}
  .roleBox b{color:#fff;}

  /* relations */
  .relations{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 4px 20px rgba(28,37,48,.06);margin-bottom:22px;}
  .relations h2{font-size:18px;font-weight:750;margin:0 0 14px;letter-spacing:-.01em;}
  .relGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:820px){.relGrid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.relGrid{grid-template-columns:1fr;}}
  .relCard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;}
  .relRole{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--amber);font-weight:700;margin-bottom:6px;}
  .relTitle{font-size:13.5px;font-weight:700;margin:0 0 5px;}
  .relDesc{font-size:12.5px;color:var(--slate);margin:0;line-height:1.4;}

  .actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px;}
  .primary{background:var(--amber);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(196,127,42,.3);font-family:inherit;}
  .ghost{background:transparent;color:var(--slate);border:1px solid var(--line);border-radius:10px;padding:11px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  footer{margin-top:22px;font-size:12px;color:#8a94a0;text-align:center;line-height:1.5;}

  @media print{
    body{background:#fff;padding:0;}
    .langBtn,.actions,.no-print{display:none !important;}
    .kaTile{cursor:default;transform:none !important;box-shadow:none !important;}
    .detail,.relations,.mnemonic{box-shadow:none;border:1px solid #ccc;}
    .mnemonic{background:#f5f5f5;color:#000;}
    .mnemonic .code{background:#333;}
    .mnemonic b{color:#000;}
    .roleBox{background:#f5f5f5;color:#000;}
    .roleBox b{color:#000;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">IIBA · BABOK® Guide · Knowledge Areas Map</div>
      <h1><span class="mono">6 Knowledge Areas</span> Explorer</h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="langBtn" id="langBtn">FR</button>
  </header>

  <div class="stats" id="stats"></div>
  <div class="mnemonic" id="mnemonic"></div>
  <div class="kaGrid" id="kaGrid"></div>
  <div class="detail" id="detail"></div>
  <div class="relations" id="relations"></div>

  <div class="actions no-print">
    <button class="ghost" id="printBtn"></button>
  </div>

  <footer id="footer"></footer>
</div>

<script>
// ─────────────────────────────────────────────────────────────
//  BABOK® 6 KNOWLEDGE AREAS — interactive explorer
// ─────────────────────────────────────────────────────────────
let lang="fr", activeKa=0;
const el=id=>document.getElementById(id);
const T=(en,fr)=>lang==="en"?en:fr;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const KAS=[
  {
    code:"BAPM", cls:"ka1", emoji:"📋",
    enName:"Business Analysis Planning & Monitoring",
    frName:"Planification et suivi de la BA",
    enRole:"Organizes and coordinates BA work itself",
    frRole:"Organise et coordonne le travail BA lui-même",
    enPurpose:"How the BA does BA — the \"meta\" knowledge area that governs how every other KA is performed.",
    frPurpose:"Comment le BA fait la BA — le domaine « méta » qui gouverne l'exécution de tous les autres KA.",
    verbs:"Plan · Identify",
    tasks:[
      "Plan Business Analysis Approach",
      "Plan Stakeholder Engagement",
      "Plan Business Analysis Governance",
      "Plan Business Analysis Information Management",
      "Identify Business Analysis Performance Improvements"
    ],
    tasksFr:[
      "Planifier l'approche de la BA",
      "Planifier l'engagement des parties prenantes",
      "Planifier la gouvernance de la BA",
      "Planifier la gestion de l'information de la BA",
      "Identifier les améliorations de performance de la BA"
    ],
    enTip:"The GOVERNOR — sits above the others and shapes HOW the whole BA effort runs.",
    frTip:"Le GOUVERNEUR — se place au-dessus des autres et façonne COMMENT tout l'effort BA se déroule."
  },
  {
    code:"E&C", cls:"ka2", emoji:"🗣️",
    enName:"Elicitation & Collaboration",
    frName:"Élicitation et collaboration",
    enRole:"Draws out and shares BA information",
    frRole:"Fait émerger et partage l'information BA",
    enPurpose:"Feeds all the other KAs with information gathered from and shared with stakeholders.",
    frPurpose:"Alimente tous les autres KA en information recueillie auprès des parties prenantes et partagée avec elles.",
    verbs:"Prepare · Conduct · Confirm · Communicate · Manage",
    tasks:[
      "Prepare for Elicitation",
      "Conduct Elicitation",
      "Confirm Elicitation Results",
      "Communicate Business Analysis Information",
      "Manage Stakeholder Collaboration"
    ],
    tasksFr:[
      "Préparer l'élicitation",
      "Conduire l'élicitation",
      "Confirmer les résultats de l'élicitation",
      "Communiquer l'information de la BA",
      "Gérer la collaboration avec les parties prenantes"
    ],
    enTip:"The FEEDER — the source of information that fuels every other knowledge area.",
    frTip:"L'ALIMENTEUR — la source d'information qui alimente tous les autres domaines."
  },
  {
    code:"RLCM", cls:"ka3", emoji:"🔄",
    enName:"Requirements Life Cycle Management",
    frName:"Gestion du cycle de vie des exigences",
    enRole:"Manages requirements from inception to retirement",
    frRole:"Gère les exigences de la naissance à la retraite",
    enPurpose:"Keeps requirements and designs traceable, prioritized, approved, and current throughout their whole life.",
    frPurpose:"Maintient les exigences et designs traçables, priorisés, approuvés et à jour tout au long de leur vie.",
    verbs:"Trace · Maintain · Prioritize · Assess · Approve",
    tasks:[
      "Trace Requirements",
      "Maintain Requirements",
      "Prioritize Requirements",
      "Assess Requirements Changes",
      "Approve Requirements"
    ],
    tasksFr:[
      "Tracer les exigences",
      "Maintenir les exigences",
      "Prioriser les exigences",
      "Évaluer les changements d'exigences",
      "Approuver les exigences"
    ],
    enTip:"The LIFECYCLE KEEPER — makes sure R&D stay healthy from birth to retirement.",
    frTip:"LE GARDIEN DU CYCLE DE VIE — s'assure que les R&D restent saines de la naissance à la retraite."
  },
  {
    code:"SA", cls:"ka4", emoji:"🧭",
    enName:"Strategy Analysis",
    frName:"Analyse stratégique",
    enRole:"Understands why change is needed",
    frRole:"Comprend pourquoi le changement est nécessaire",
    enPurpose:"First link of the value chain — analyses current state, defines future state, and produces the change strategy.",
    frPurpose:"Premier maillon de la chaîne de valeur — analyse l'état actuel, définit l'état futur et produit la stratégie de changement.",
    verbs:"Analyze · Define · Assess · Define",
    tasks:[
      "Analyze Current State",
      "Define Future State",
      "Assess Risks",
      "Define Change Strategy"
    ],
    tasksFr:[
      "Analyser l'état actuel",
      "Définir l'état futur",
      "Évaluer les risques",
      "Définir la stratégie de changement"
    ],
    enTip:"The WHY — asks and answers \"why change, and toward what?\" Only KA with 4 tasks (not 5).",
    frTip:"LE POURQUOI — pose et répond à « pourquoi changer, et vers quoi ? ». Seul KA à 4 tâches (pas 5)."
  },
  {
    code:"RADD", cls:"ka5", emoji:"🏗️",
    enName:"Requirements Analysis & Design Definition",
    frName:"Analyse des exigences & définition du design",
    enRole:"Structures, models, verifies & validates R&D",
    frRole:"Structure, modélise, vérifie & valide les R&D",
    enPurpose:"The design engine — turns business needs into concrete, structured requirements and designs.",
    frPurpose:"Le moteur de conception — transforme les besoins en exigences et designs concrets et structurés.",
    verbs:"Specify · Verify · Validate · Define · Define · Analyze",
    tasks:[
      "Specify and Model Requirements",
      "Verify Requirements",
      "Validate Requirements",
      "Define Requirements Architecture",
      "Define Design Options",
      "Analyze Potential Value and Recommend Solution"
    ],
    tasksFr:[
      "Spécifier et modéliser les exigences",
      "Vérifier les exigences",
      "Valider les exigences",
      "Définir l'architecture des exigences",
      "Définir les options de design",
      "Analyser la valeur potentielle et recommander la solution"
    ],
    enTip:"The DESIGN ENGINE — the biggest KA (6 tasks). Verify (internal) vs Validate (external value) matter here.",
    frTip:"LE MOTEUR DE CONCEPTION — le plus grand KA (6 tâches). Vérifier (interne) vs Valider (valeur externe) sont clés."
  },
  {
    code:"SE", cls:"ka6", emoji:"✅",
    enName:"Solution Evaluation",
    frName:"Évaluation de la solution",
    enRole:"Assesses performance & recommends improvements",
    frRole:"Évalue la performance & recommande des améliorations",
    enPurpose:"Last link of the value chain — did the delivered solution actually create value? What limits it? What next?",
    frPurpose:"Dernier maillon de la chaîne de valeur — la solution livrée crée-t-elle vraiment de la valeur ? Qu'est-ce qui la limite ? Et après ?",
    verbs:"Measure · Analyze · Assess · Assess · Recommend",
    tasks:[
      "Measure Solution Performance",
      "Analyze Performance Measures",
      "Assess Solution Limitations",
      "Assess Enterprise Limitations",
      "Recommend Actions to Increase Solution Value"
    ],
    tasksFr:[
      "Mesurer la performance de la solution",
      "Analyser les mesures de performance",
      "Évaluer les limitations de la solution",
      "Évaluer les limitations de l'entreprise",
      "Recommander des actions pour accroître la valeur de la solution"
    ],
    enTip:"THE \"DID IT WORK?\" — closes the loop. Assess Solution (inside) vs Assess Enterprise (outside) — mirror pair.",
    frTip:"LE « ÇA A MARCHÉ ? » — ferme la boucle. Évaluer Solution (intérieur) vs Évaluer Entreprise (extérieur) — paire miroir."
  }
];

const RELATIONS=[
  {enRole:"Governor", frRole:"Gouverneur",
   enT:"BA Planning & Monitoring", frT:"Planification & Suivi BA",
   enD:"Sits above and shapes how all other KAs are performed.",
   frD:"Se place au-dessus et façonne comment tous les autres KA s'exécutent."},
  {enRole:"Feeder", frRole:"Alimenteur",
   enT:"Elicitation & Collaboration", frT:"Élicitation & Collaboration",
   enD:"Feeds information into every other knowledge area.",
   frD:"Alimente en information tous les autres domaines."},
  {enRole:"Value chain", frRole:"Chaîne de valeur",
   enT:"Strategy → RADD → Solution Eval", frT:"Stratégie → RADD → Évaluation",
   enD:"Turn need into value: why change → what to build → did it work.",
   frD:"Transforme le besoin en valeur : pourquoi changer → quoi construire → est-ce que ça a marché."},
  {enRole:"Lifecycle keeper", frRole:"Gardien du cycle de vie",
   enT:"Requirements Life Cycle Management", frT:"Gestion du cycle de vie des exigences",
   enD:"Keeps R&D healthy across the whole initiative — trace, prioritize, approve.",
   frD:"Maintient les R&D saines pendant toute l'initiative — tracer, prioriser, approuver."}
];

function renderStatic(){
  el("langBtn").textContent=lang==="en"?"FR":"EN";
  el("sub").textContent=T(
    "The 6 knowledge areas of the BABOK® Guide — where each of the 30 BA tasks lives. Click any tile to explore.",
    "Les 6 domaines de connaissance du guide BABOK® — où vivent chacune des 30 tâches BA. Cliquez sur une tuile pour explorer.");
  el("printBtn").textContent=T("Print / Save PDF","Imprimer / Enregistrer PDF");
  el("footer").textContent=T(
    "Study map based on the BABOK® Guide. 30 tasks · 6 knowledge areas · aligned to the BACCM™. Practice aid — not exam content.",
    "Carte d'étude basée sur le guide BABOK®. 30 tâches · 6 domaines · alignés sur le BACCM™. Aide à la pratique — non testé à l'examen.");
}
function renderStats(){
  const c=el("stats");
  c.innerHTML=`
    <div class="stat"><b>6</b>${T("knowledge areas","domaines")}</div>
    <div class="stat"><b>30</b>${T("total tasks","tâches totales")}</div>
    <div class="stat"><b>5-5-5-4-6-5</b>${T("tasks per KA","tâches par KA")}</div>
    <div class="stat"><b>4</b>${T("BACCM™ concepts aligned","concepts BACCM™ alignés")}</div>`;
}
function renderMnemonic(){
  el("mnemonic").innerHTML=`
    <span class="code">P-E-R-S-R-S</span>
    <span class="txt">${T(
      "<b>Please Excuse Rigorous Standards, Really Serious</b> — Planning · Elicitation · Requirements lifecycle · Strategy · RADD · Solution eval.",
      "<b>Planification · Élicitation · Requirements lifecycle · Stratégie · RADD · Solution eval</b> — mnémonique EN : « Please Excuse Rigorous Standards, Really Serious »."
    )}</span>`;
}
function renderGrid(){
  const c=el("kaGrid"); c.innerHTML="";
  KAS.forEach((ka,i)=>{
    const b=document.createElement("button");
    b.className=`kaTile ${ka.cls}${i===activeKa?" active":""}`;
    b.innerHTML=`
      <div>
        <div class="kaNum">KA ${i+1} · ${ka.code}</div>
        <div class="kaEmoji">${ka.emoji}</div>
        <p class="kaName">${esc(lang==="en"?ka.enName:ka.frName)}</p>
        <p class="kaRole">${esc(lang==="en"?ka.enRole:ka.frRole)}</p>
      </div>
      <span class="kaCount">${ka.tasks.length} ${T("tasks","tâches")}</span>`;
    b.onclick=()=>{activeKa=i;render();window.scrollTo({top:el("detail").offsetTop-40,behavior:"smooth"});};
    c.appendChild(b);
  });
}
function renderDetail(){
  const ka=KAS[activeKa];
  const tasks=(lang==="en"?ka.tasks:ka.tasksFr);
  const badgeColor=getComputedStyle(document.documentElement).getPropertyValue(`--ka${activeKa+1}`);
  el("detail").innerHTML=`
    <div class="detailHead">
      <span class="detailBadge" style="background:${badgeColor}">${ka.code}</span>
      <div class="detailInfo">
        <h2>${ka.emoji} ${esc(lang==="en"?ka.enName:ka.frName)}</h2>
        <p>${esc(lang==="en"?ka.enPurpose:ka.frPurpose)}</p>
      </div>
    </div>
    <div class="detailBody">
      <div class="detailSection">
        <h3>${T("The tasks","Les tâches")} (${tasks.length})</h3>
        <ol class="taskList">
          ${tasks.map((t,i)=>`<li><span class="taskNum">${i+1}.</span><span>${esc(t)}</span></li>`).join("")}
        </ol>
      </div>
      <div class="detailSection">
        <h3>${T("Signature verbs","Verbes signature")}</h3>
        <div class="verbBox"><b>${T("VERBS","VERBES")}:</b><br>${esc(ka.verbs)}</div>
        <div class="roleBox">💡 <b>${T("What to remember","À retenir")}:</b> ${esc(lang==="en"?ka.enTip:ka.frTip)}</div>
      </div>
    </div>`;
}
function renderRelations(){
  el("relations").innerHTML=`
    <h2>🧭 ${T("How the 6 KAs relate","Comment les 6 KA s'articulent")}</h2>
    <div class="relGrid">
      ${RELATIONS.map(r=>`
        <div class="relCard">
          <div class="relRole">${esc(lang==="en"?r.enRole:r.frRole)}</div>
          <p class="relTitle">${esc(lang==="en"?r.enT:r.frT)}</p>
          <p class="relDesc">${esc(lang==="en"?r.enD:r.frD)}</p>
        </div>`).join("")}
    </div>`;
}
function render(){renderStatic();renderStats();renderMnemonic();renderGrid();renderDetail();renderRelations();}
el("langBtn").onclick=()=>{lang=(lang==="en")?"fr":"en";render();};
document.addEventListener("DOMContentLoaded",()=>{el("printBtn").onclick=()=>window.print();});
render();
el("printBtn").onclick=()=>window.print();
</script>
</body>
</html>
